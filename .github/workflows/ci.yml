name: Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekdays at 06:00 UTC — catch overnight site changes
    - cron: '0 6 * * 1-5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [typecheck]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run smoke tests
        run: npm run test:smoke
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  functional:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: [smoke]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run functional tests
        run: npx playwright test --grep "@functional"
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  navigation:
    name: Navigation Tests
    runs-on: ubuntu-latest
    needs: [smoke]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run navigation tests
        run: npm run test:navigation
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  forms:
    name: Forms Tests
    runs-on: ubuntu-latest
    needs: [smoke]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run forms tests
        run: npm run test:forms
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forms-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  responsive:
    name: Responsive Tests
    runs-on: ubuntu-latest
    needs: [smoke]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run responsive tests
        run: npm run test:responsive
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    # Visual tests only run on push to main (baselines are machine-specific)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run visual regression tests
        run: npm run test:visual
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-results
          path: |
            playwright-report/
            test-results/
            __snapshots__/
          retention-days: 30
